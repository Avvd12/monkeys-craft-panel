<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar · Monkey's Craft</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
  <style>
    :root, [data-theme="dark"] {
      --accent: #F0A62B;
      --accent-hover: #d99018;
      --accent-contrast: #09090b;
      --bg: #09090b;
      --card: rgba(20, 20, 26, 0.92);
      --surface: #1c1c24;
      --border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --text-secondary: #b4b4be;
    }
    [data-theme="light"] {
      --accent: #F0A62B;
      --accent-hover: #d99018;
      --accent-contrast: #09090b;
      --bg: #f1f5f9;
      --card: rgba(255, 255, 255, 0.96);
      --surface: #f8fafc;
      --border: #cbd5e1;
      --text: #0f172a;
      --text-secondary: #475569;
    }
    [hidden] { display: none !important; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
    }
    .font-display { font-family: 'Chakra Petch', sans-serif; }
    .font-mono-code { font-family: 'JetBrains Mono', monospace; }
    .login-box {
      background: var(--card);
      backdrop-filter: blur(18px);
      border: 1px solid var(--border);
    }
    .input-box {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .input-box:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    .btn-primary {
      background-color: var(--accent);
      color: var(--accent-contrast);
      font-weight: 700;
      transition: background-color 0.15s ease;
    }
    .btn-primary:hover:not(:disabled) { background-color: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.55; cursor: wait; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

  <form id="loginForm" class="login-box w-full max-w-[390px] rounded-2xl p-8 shadow-2xl flex flex-col items-center">
    <!-- Logo com fallback textual nunca vazio -->
    <div class="w-20 h-20 rounded-2xl p-1.5 border border-[#F0A62B] bg-black/25 mb-4 flex items-center justify-center overflow-hidden">
      <img
        src="assets/logo.png"
        alt="Logo Monkey's Craft"
        class="w-full h-full object-contain rounded-xl"
        onerror="this.onerror=null; this.replaceWith(criarFallback());"
      />
    </div>

    <h1 class="font-display text-2xl font-bold uppercase tracking-wider text-[#F0A62B]">Monkey's Craft</h1>
    <p class="font-display text-xs font-semibold uppercase tracking-[0.2em] text-[var(--text-secondary)] mb-6">Painel de Controle</p>

    <!-- ETAPA 1: CREDENCIAIS (USUÁRIO E SENHA) -->
    <div id="stepCredentials" class="w-full space-y-4">
      <label class="w-full flex flex-col gap-1.5">
        <span class="text-xs font-bold uppercase tracking-wider text-[var(--text-secondary)]">Usuário</span>
        <input
          type="text"
          id="usuario"
          name="usuario"
          autocomplete="username"
          required
          class="input-box rounded-xl px-4 py-2.5 text-sm"
        />
      </label>

      <label class="w-full flex flex-col gap-1.5">
        <span class="text-xs font-bold uppercase tracking-wider text-[var(--text-secondary)]">Senha</span>
        <input
          type="password"
          id="senha"
          name="senha"
          autocomplete="current-password"
          required
          class="input-box rounded-xl px-4 py-2.5 text-sm"
        />
      </label>
    </div>

    <!-- ETAPA 2: SEGUNDO FATOR TOTP (SÓ APARECE SE EXIGIDO PELA CONTA) -->
    <div id="stepTotp" class="w-full space-y-3 mb-2" hidden>
      <div class="p-3 rounded-xl bg-[#F0A62B]/15 border border-[#F0A62B]/40 text-xs">
        Esta conta administrativa exige verificação em duas etapas (2FA).
      </div>
      <label class="w-full flex flex-col gap-1.5">
        <span class="text-xs font-bold uppercase tracking-wider text-[#F0A62B]">Código do Autenticador (6 dígitos)</span>
        <input
          type="text"
          id="codigoTotp"
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="6"
          placeholder="000000"
          class="input-box font-mono-code text-center text-lg tracking-widest rounded-xl px-4 py-2.5"
        />
      </label>
    </div>

    <!-- Aviso de Caps Lock Ativado -->
    <p id="capsLockWarn" hidden class="w-full text-xs p-2.5 rounded-xl bg-yellow-500/15 border border-yellow-500/40 text-yellow-300 mt-3">
      ⚠️ Caps Lock está ativado.
    </p>

    <!-- Erro Inline -->
    <p id="loginErro" role="alert" hidden class="w-full text-xs p-3 rounded-xl bg-red-500/15 border border-red-500/40 text-red-400 mt-3"></p>

    <button type="submit" id="loginBtn" class="btn-primary w-full py-3 rounded-xl font-display font-bold uppercase tracking-wider text-sm mt-5">
      Continuar
    </button>

    <p class="text-[11px] text-[var(--text-secondary)] mt-5 text-center">Acesso restrito à administração.</p>
  </form>

  <script>
    function criarFallback() {
      const s = document.createElement('span');
      s.className = 'font-display font-bold text-xs text-[#F0A62B] text-center';
      s.textContent = "MONKEY'S CRAFT";
      return s;
    }

    const savedTheme = localStorage.getItem('mc_panel_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);

    const form = document.getElementById('loginForm');
    const campoUsuario = document.getElementById('usuario');
    const campoSenha = document.getElementById('senha');
    const campoTotp = document.getElementById('codigoTotp');
    const stepCredentials = document.getElementById('stepCredentials');
    const stepTotp = document.getElementById('stepTotp');
    const caixaErro = document.getElementById('loginErro');
    const capsWarn = document.getElementById('capsLockWarn');
    const botao = document.getElementById('loginBtn');

    let aguardandoTotp = false;

    /* Detector de Caps Lock */
    function checarCapsLock(ev) {
      if (typeof ev.getModifierState === 'function') {
        capsWarn.hidden = !ev.getModifierState('CapsLock');
      }
    }
    campoSenha.addEventListener('keyup', checarCapsLock);
    campoSenha.addEventListener('keydown', checarCapsLock);

    function mostrarErro(texto) {
      caixaErro.textContent = texto;
      caixaErro.hidden = false;
    }

    form.addEventListener('submit', async function (evento) {
      evento.preventDefault();
      caixaErro.hidden = true;
      botao.disabled = true;
      botao.textContent = 'Verificando...';

      try {
        const resposta = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            usuario: campoUsuario.value.trim(),
            senha: campoSenha.value,
            totp: aguardandoTotp ? campoTotp.value.trim() : undefined
          })
        });

        const dados = await resposta.json().catch(() => ({}));

        if (resposta.status === 428 || dados.requerTotp) {
          aguardandoTotp = true;
          stepCredentials.hidden = true;
          stepTotp.hidden = false;
          botao.textContent = 'Validar 2FA e Entrar';
          campoTotp.focus();
          return;
        }

        if (!resposta.ok) {
          mostrarErro(dados.erro || 'Não foi possível entrar.');
          return;
        }

        window.location.href = '/';
      } catch {
        mostrarErro('Falha de conexão com o painel.');
      } finally {
        botao.disabled = false;
        if (!aguardandoTotp) botao.textContent = 'Continuar';
      }
    });

    fetch('/auth/me')
      .then(r => r.json())
      .then(d => { if (d.logado) window.location.href = '/'; })
      .catch(() => {});
  </script>
</body>
</html>
