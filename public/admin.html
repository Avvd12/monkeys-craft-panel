<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contas & Permissões · Monkey's Craft</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root, [data-theme="dark"] {
      --accent: #F0A62B;
      --accent-hover: #d99018;
      --accent-soft: rgba(240, 166, 43, 0.14);
      --accent-border: rgba(240, 166, 43, 0.42);
      --accent-contrast: #09090b;
      --bg-main: #09090b;
      --bg-panel: rgba(18, 18, 23, 0.92);
      --bg-card: #14141a;
      --bg-surface: #1c1c24;
      --border-color: rgba(255, 255, 255, 0.09);
      --text-main: #f8fafc;
      --text-secondary: #b4b4be;
      --text-muted: #8e8e99;
    }

    [data-theme="light"] {
      --accent: #F0A62B;
      --accent-hover: #d99018;
      --accent-soft: rgba(240, 166, 43, 0.18);
      --accent-border: rgba(240, 166, 43, 0.55);
      --accent-contrast: #09090b;
      --bg-main: #f1f5f9;
      --bg-panel: rgba(255, 255, 255, 0.96);
      --bg-card: #ffffff;
      --bg-surface: #f8fafc;
      --border-color: #cbd5e1;
      --text-main: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
    }
    .font-display { font-family: 'Chakra Petch', sans-serif; }
    .font-mono-code { font-family: 'JetBrains Mono', monospace; }

    input:focus-visible, select:focus-visible, button:focus-visible {
      outline: 2px solid var(--accent) !important;
      outline-offset: 2px;
    }

    .card-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 1rem;
    }
    .surface-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
    }
    .text-accent { color: var(--accent); }
    .bg-accent-soft { background-color: var(--accent-soft); border: 1px solid var(--accent-border); color: var(--accent); }

    .btn-primary {
      background-color: var(--accent);
      color: var(--accent-contrast);
      font-weight: 700;
      border: 1px solid var(--accent);
      transition: background-color 0.15s ease;
    }
    .btn-primary:hover:not(:disabled) { background-color: var(--accent-hover); }

    .btn-secondary {
      background: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      font-weight: 600;
      transition: border-color 0.15s ease, color 0.15s ease;
    }
    .btn-secondary:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }

    .btn-danger {
      background: rgba(239, 68, 68, 0.12);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.42);
      font-weight: 700;
      transition: all 0.15s ease;
    }
    .btn-danger:hover:not(:disabled) {
      background: rgba(239, 68, 68, 0.24);
      border-color: #ef4444;
      color: #fecaca;
    }
    .btn-danger:disabled { opacity: 0.4; cursor: not-allowed; }

    .data-table { width: 100%; border-collapse: collapse; font-size: 0.83rem; }
    .data-table th {
      text-align: left;
      font-size: 0.69rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-muted);
      padding: 0.7rem 0.85rem;
      border-bottom: 1px solid var(--border-color);
    }
    .data-table td {
      padding: 0.65rem 0.85rem;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
    }
    .data-table tbody tr:last-child td { border-bottom: none; }
    .data-table tbody tr:hover td { background-color: rgba(240, 166, 43, 0.07); }

    .data-table th.col-actions,
    .data-table td.col-actions {
      text-align: left;
      width: 1%;
      white-space: nowrap;
    }
    .action-cell-fixed {
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      gap: 0.4rem;
      white-space: nowrap;
    }
    .btn-table-action {
      height: 28px;
      padding: 0 0.65rem;
      border-radius: 0.5rem;
      font-size: 0.73rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      line-height: 1;
    }
  </style>
</head>
<body class="min-h-screen p-4 lg:p-8">

  <div class="max-w-6xl mx-auto space-y-6">
    <!-- Cabeçalho Unificado -->
    <header class="card-box p-5 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3.5">
        <div class="w-11 h-11 rounded-xl surface-box p-1 flex items-center justify-center border border-[#F0A62B]">
          <img
            src="assets/logo.png"
            alt="Monkey's Craft"
            class="w-full h-full object-contain rounded-lg"
            onerror="this.style.display='none'"
          />
        </div>
        <div>
          <h1 class="font-display font-bold text-xl uppercase tracking-wider text-accent leading-none">
            Usuários & Permissões do Painel
          </h1>
          <p class="text-xs text-[var(--text-secondary)] mt-1" id="topoSub">
            Sincronização direta com a fonte única de grupos do servidor
          </p>
        </div>
      </div>

      <div class="flex items-center gap-2.5">
        <a href="/?view=configuracoes" class="btn-secondary px-3.5 py-2 rounded-xl text-xs flex items-center gap-1.5">
          <i data-lucide="layout-dashboard" class="w-4 h-4 text-accent"></i>
          <span>Abrir no Painel Principal</span>
        </a>
        <a href="/" class="btn-secondary px-3.5 py-2 rounded-xl text-xs flex items-center gap-1.5">
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
          <span>Voltar aos Consoles</span>
        </a>
        <button type="button" id="btnSair" class="btn-danger px-3.5 py-2 rounded-xl text-xs flex items-center gap-1.5">
          <i data-lucide="log-out" class="w-4 h-4"></i>
          <span>Sair</span>
        </button>
      </div>
    </header>

    <p id="aviso" class="text-xs p-3.5 rounded-xl font-semibold" hidden></p>

    <!-- Card de Criação / Edição na Nova Estética -->
    <section class="card-box p-6 space-y-5">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <h2 class="font-display font-bold text-base uppercase tracking-wider text-accent" id="tituloForm">
          Gerenciamento de Contas & Permissões
        </h2>
        <span class="text-[11px] font-mono-code px-2.5 py-1 rounded surface-box">2FA Obrigatório: owner / admin</span>
      </div>

      <form id="formUsuario" class="grid grid-cols-1 md:grid-cols-5 gap-3 items-end">
        <label class="flex flex-col gap-1">
          <span class="text-[11px] font-bold uppercase tracking-wider text-[var(--text-secondary)]">Usuário / Login</span>
          <input type="text" id="campoUsuario" autocomplete="off" placeholder="ex: arthur" required class="surface-box rounded-xl px-3.5 py-2 text-xs outline-none">
        </label>
        <label class="flex flex-col gap-1">
          <span class="text-[11px] font-bold uppercase tracking-wider text-[var(--text-secondary)]">Senha</span>
          <input type="password" id="campoSenha" autocomplete="new-password" placeholder="mínimo 8 caracteres" required class="surface-box rounded-xl px-3.5 py-2 text-xs outline-none">
        </label>
        <label class="flex flex-col gap-1">
          <span class="text-[11px] font-bold uppercase tracking-wider text-[var(--text-secondary)]">Cargo (Grupo Servidor)</span>
          <select id="campoCargo" class="surface-box rounded-xl px-3.5 py-2 text-xs outline-none">
            <option value="owner">Owner (Grupo: dono)</option>
            <option value="admin">Admin (Grupo: admin)</option>
            <option value="moderador">Moderator (Grupo: moderador)</option>
            <option value="suporte">Support (Grupo: suporte)</option>
          </select>
        </label>
        <label class="flex flex-col gap-1">
          <span class="text-[11px] font-bold uppercase tracking-wider text-[var(--text-secondary)]">Motivo (Auditoria)</span>
          <input type="text" id="campoMotivo" placeholder="Ex: Promoção staff" required class="surface-box rounded-xl px-3.5 py-2 text-xs outline-none">
        </label>
        <div class="flex gap-2">
          <button type="submit" id="btnSalvar" class="btn-primary px-4 py-2 rounded-xl text-xs font-display uppercase tracking-wider flex-1">
            Salvar & Sincronizar
          </button>
          <button type="button" id="btnCancelar" class="btn-secondary px-3 py-2 rounded-xl text-xs" hidden>
            Cancelar
          </button>
        </div>
      </form>

      <!-- Tabela Cadastrados com AÇÕES perfeitamente alinhadas -->
      <div class="overflow-x-auto pt-2">
        <table class="data-table">
          <thead>
            <tr>
              <th>Operador</th>
              <th>Cargo Painel ↔ Grupo Jogo</th>
              <th>Criado em</th>
              <th class="col-actions">Ações</th>
            </tr>
          </thead>
          <tbody id="corpoTabela"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    lucide.createIcons();
    const savedTheme = localStorage.getItem('mc_panel_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);

    const aviso = document.getElementById('aviso');
    const corpoTabela = document.getElementById('corpoTabela');
    const topoSub = document.getElementById('topoSub');
    const form = document.getElementById('formUsuario');
    const campoUsuario = document.getElementById('campoUsuario');
    const campoSenha = document.getElementById('campoSenha');
    const campoCargo = document.getElementById('campoCargo');
    const campoMotivo = document.getElementById('campoMotivo');
    const btnSalvar = document.getElementById('btnSalvar');
    const btnCancelar = document.getElementById('btnCancelar');
    const tituloForm = document.getElementById('tituloForm');

    let editando = null;
    let meuLogin = 'arthur';

    function mostrarAviso(texto, tipo) {
      aviso.textContent = texto;
      aviso.className = 'text-xs p-3.5 rounded-xl font-semibold ' + (tipo === 'ok'
        ? 'bg-emerald-500/15 border border-emerald-500/40 text-emerald-300'
        : 'bg-red-500/15 border border-red-500/40 text-red-300');
      aviso.hidden = false;
      clearTimeout(mostrarAviso.timer);
      mostrarAviso.timer = setTimeout(() => { aviso.hidden = true; }, 5000);
    }

    function dataCurta(iso) {
      if (!iso) return '—';
      try { return new Date(iso).toLocaleDateString('pt-BR'); } catch { return '—'; }
    }

    function limparForm() {
      editando = null;
      form.reset();
      campoUsuario.disabled = false;
      tituloForm.textContent = 'Gerenciamento de Contas & Permissões';
      btnCancelar.hidden = true;
    }

    function preencherForm(u) {
      editando = u.usuario;
      campoUsuario.value = u.usuario;
      campoUsuario.disabled = true;
      campoSenha.value = '';
      campoCargo.value = u.cargo;
      tituloForm.textContent = 'Editar Operador: ' + u.usuario;
      btnCancelar.hidden = false;
      campoSenha.focus();
    }

    function renderizarLinhas(lista) {
      topoSub.textContent = `${lista.length} operador(es) ativo(s) no painel`;
      corpoTabela.innerHTML = lista.map(u => {
        const isSelf = u.usuario === meuLogin;
        return `
          <tr>
            <td>
              <div class="font-bold flex items-center gap-2.5">
                <img src="https://mc-heads.net/avatar/${u.nome || u.usuario}/24" class="w-6 h-6 rounded shrink-0" alt="">
                <span>${u.nome || u.usuario}</span>
                ${isSelf ? '<span class="text-[10px] px-1.5 py-0.5 rounded bg-accent-soft">Você</span>' : ''}
              </div>
              <div class="text-xs text-[var(--text-secondary)]">@${u.usuario}</div>
            </td>
            <td>
              <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold uppercase bg-accent-soft">
                ${u.cargo}
              </span>
            </td>
            <td class="text-[var(--text-secondary)]">${dataCurta(u.criadoEm)}</td>
            <td class="col-actions">
              <div class="action-cell-fixed">
                <button type="button" onclick='preencherForm(${JSON.stringify({ usuario: u.usuario, cargo: u.cargo })})' class="btn-secondary btn-table-action">
                  Editar
                </button>
                <button type="button" onclick="remover('${u.usuario}')" class="btn-danger btn-table-action" ${isSelf ? 'disabled title="Você não pode remover a própria conta"' : ''}>
                  Remover
                </button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    async function carregar() {
      try {
        const r = await fetch('/api/usuarios');
        const d = await r.json();
        if (!r.ok) throw new Error(d.erro);
        renderizarLinhas(d.usuarios || []);
      } catch {
        renderizarLinhas([
          { usuario: 'arthur', nome: 'Artzz', cargo: 'admin', criadoEm: '2026-10-21T08:07:24.015Z' },
          { usuario: 'mod_raids', nome: 'Bruno', cargo: 'moderador', criadoEm: '2026-10-21T23:08:07.121Z' }
        ]);
      }
    }

    async function remover(usuario) {
      const motivo = prompt(`Informe o motivo para remover "${usuario}" (Auditoria):`);
      if (!motivo) return;
      try {
        const r = await fetch('/api/usuarios/' + encodeURIComponent(usuario), {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ motivo })
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) { mostrarAviso(d.erro || 'Não foi possível remover.', 'erro'); return; }
        mostrarAviso(`Operador "${usuario}" removido com sucesso.`, 'ok');
        carregar();
      } catch {
        mostrarAviso('Falha de conexão com o painel.', 'erro');
      }
    }

    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      btnSalvar.disabled = true;
      try {
        const r = await fetch('/api/usuarios', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            usuario: campoUsuario.value.trim().toLowerCase(),
            senha: campoSenha.value,
            cargo: campoCargo.value,
            motivo: campoMotivo.value.trim()
          })
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) { mostrarAviso(d.erro || 'Não foi possível salvar.', 'erro'); return; }
        mostrarAviso(d.atualizado ? 'Operador atualizado.' : 'Operador criado.', 'ok');
        limparForm();
        carregar();
      } catch {
        mostrarAviso('Falha de conexão com o painel.', 'erro');
      } finally {
        btnSalvar.disabled = false;
      }
    });

    btnCancelar.addEventListener('click', limparForm);

    document.getElementById('btnSair').addEventListener('click', async () => {
      try { await fetch('/auth/logout', { method: 'POST' }); } catch {}
      window.location.href = '/login.html';
    });

    (async function iniciar() {
      try {
        const r = await fetch('/auth/me');
        const d = await r.json();
        if (d && (d.usuario || d.login)) meuLogin = d.usuario || d.login;
      } catch {}
      carregar();
    })();
  </script>
</body>
</html>
